syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.Mutlithreading_Tester.gRPC.peopleimage";
// option java_outer_classname = "GreetProto";

package peopleimage;

//import "enums.proto";
//import "PersonImage.proto";
import "PersonImageBytes.proto";
//import "google/protobuf/empty.proto";

import "PeopleInfo_Common.proto";

message PersonImageBytesNameEmailDTO {
    string name = 1;
    string email = 2;
    bytes biometrics = 3;
}

message PersonImageBytesNameEmailListDTO {
    repeated PersonImageBytesNameEmailDTO personImageBytesNameEmailList = 1;
}

// gRPC Service
service PeopleInfoB {
    rpc NationalityImageBytes(NationalityDTO) returns (PersonImageBytesProtobufListDTO);
    rpc PersonImageBytes (IdentificationPassportNationalityDTO) returns (PersonImageBytesProtobufDTO);
    rpc PeopleEmailImageBytes (NationalityDTO) returns (PersonImageBytesNameEmailListDTO);
}
